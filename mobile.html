<!DOCTYPE html>
<!--
  skySchedule mobile

  The same application as the desktop build, driven with a thumb. Every
  desktop capability is present; what changes is the mechanics - dropdowns
  become bottom sheets, the week grid becomes a vertical agenda, and long
  authoring flows become full-screen surfaces with their own app bar.

  One document, five views. Tapping a tab swaps the view rather than
  navigating, so the tab bar never flashes and scroll position survives.
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>skySchedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./mobile.css?v=15" />
</head>
<body>
<div class="m-app">

  <!-- ============================ HOME ============================ -->
  <section class="m-view" id="v-home">
    <header class="m-appbar">
      <button class="m-icon-btn state-layer" data-sheet="location" aria-label="Change location">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
      </button>
      <span class="m-appbar-title" id="homeLocation">Skypoint Main Campus</span>
      <button class="m-icon-btn state-layer" data-sheet="notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
      </button>
      <button class="m-icon-btn state-layer" data-goto="more" aria-label="Your account">
        <span class="m-avatar is-sm av-c5">SA</span>
      </button>
    </header>

    <main class="m-body" id="homeBody"></main>
  </section>

  <!-- ========================== SCHEDULE ========================== -->
  <section class="m-view" id="v-schedule" hidden>
    <header class="m-appbar">
      <span class="m-appbar-title">Schedule</span>
      <button class="m-icon-btn state-layer" id="schedSearchBtn" aria-label="Search shifts">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      </button>
      <button class="m-icon-btn state-layer" data-sheet="schedFilter" aria-label="Filter shifts">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
        <span class="m-badge is-info" id="schedFilterCount" hidden style="position:absolute;top:2px;right:2px;min-width:16px;padding:0 4px;height:16px;font-size:10px;">0</span>
      </button>
    </header>

    <!-- Range control. A tap opens the month sheet; the chevrons step a
         week. No horizontal date strip - a swipeable rail hides most of
         the range behind a gesture with no affordance. -->
    <div style="display:flex;align-items:center;gap:var(--space-1);padding:var(--space-2) var(--space-2);border-bottom:1px solid var(--border-subtle);background:var(--color-panel-solid);">
      <button class="m-icon-btn state-layer" id="weekPrev" aria-label="Previous week">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="m-btn m-btn-text state-layer" id="rangeBtn" style="flex:1;font-weight:var(--weight-medium);">
        <span id="rangeLabel">Jul 26 &ndash; Aug 1</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px;"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="m-icon-btn state-layer" id="weekNext" aria-label="Next week">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <div class="m-chip-row" id="schedChips">
      <button class="m-chip is-selected state-layer" data-status="all">All</button>
      <button class="m-chip state-layer" data-status="open">Open</button>
      <button class="m-chip state-layer" data-status="unfulfilled">Unfulfilled</button>
      <button class="m-chip state-layer" data-status="confirmed">Confirmed</button>
      <button class="m-chip state-layer" data-status="draft">Draft</button>
    </div>

    <main class="m-body is-flush has-fab" id="schedBody"></main>

    <button class="m-fab is-extended state-layer" id="fabShift">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      Create shift
    </button>
  </section>

  <!-- ============================ BFMS ============================ -->
  <section class="m-view" id="v-bfms" hidden>
    <header class="m-appbar">
      <span class="m-appbar-title">BFMs</span>
      <button class="m-icon-btn state-layer" data-sheet="bfmSort" aria-label="Sort">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h10"/><path d="M11 8h7"/><path d="M11 12h4"/></svg>
      </button>
    </header>

    <div class="m-section" style="padding-bottom:var(--space-2);">
      <div class="m-search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--fg-subtle)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        <input id="bfmSearch" placeholder="Search name, position or ID" autocomplete="off" />
      </div>
    </div>

    <div class="m-chip-row" id="bfmChips">
      <button class="m-chip is-selected state-layer" data-acct="active">Active</button>
      <button class="m-chip state-layer" data-acct="suspended">Suspended</button>
      <button class="m-chip state-layer" data-acct="deactivated">Deactivated</button>
      <button class="m-chip state-layer" data-acct="all">Everyone</button>
    </div>

    <main class="m-body is-flush has-fab" id="bfmBody"></main>

    <button class="m-fab state-layer" id="fabBfm" aria-label="Add BFM">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
  </section>

  <!-- ========================== MESSAGES ========================== -->
  <section class="m-view" id="v-messages" hidden>
    <header class="m-appbar">
      <span class="m-appbar-title">Messages</span>
    </header>

    <div class="m-section" style="padding-bottom:var(--space-3);">
      <div class="m-segmented" id="msgSeg">
        <button class="m-segmented-item is-active state-layer" data-pane="templates">Templates</button>
        <button class="m-segmented-item state-layer" data-pane="sent">Sent</button>
      </div>
    </div>

    <main class="m-body is-flush has-fab" id="msgBody"></main>

    <button class="m-fab is-extended state-layer" id="fabCompose">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
      Compose
    </button>
  </section>

  <!-- ============================ MORE ============================ -->
  <section class="m-view" id="v-more" hidden>
    <!-- Small app bar like the other four tabs. The large variant needs an
         action row to justify its height; with nothing in it, it was 56px
         of blank above the title. -->
    <header class="m-appbar">
      <span class="m-appbar-title">More</span>
    </header>
    <main class="m-body is-flush" id="moreBody"></main>
  </section>

  <!-- ========================== TAB BAR =========================== -->
  <nav class="m-tabbar" aria-label="Primary">
    <a class="m-tab is-active state-layer" role="button" tabindex="0" data-tab="home" aria-current="page">
      <span class="m-tab-icon">
        <svg class="m-icon-outline" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <svg class="m-icon-filled" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M11.35 2.71a1 1 0 0 1 1.3 0l7 6A2 2 0 0 1 20.36 10v9a2 2 0 0 1-2 2h-3.4v-7.5a1 1 0 0 0-1-1h-3.92a1 1 0 0 0-1 1V21h-3.4a2 2 0 0 1-2-2v-9a2 2 0 0 1 .7-1.29z"/></svg>
      </span>
      <span class="m-tab-label">Home</span>
      <span class="m-tab-badge" id="tabHomeBadge" hidden>0</span>
    </a>
    <a class="m-tab state-layer" role="button" tabindex="0" data-tab="schedule">
      <span class="m-tab-icon">
        <svg class="m-icon-outline" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <svg class="m-icon-filled" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M8 1a1 1 0 0 1 1 1v1h6V2a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h1V2a1 1 0 0 1 1-1z"/><path stroke="var(--color-panel-solid)" stroke-width="1.75" stroke-linecap="round" d="M3.5 9.5h17"/><circle cx="8" cy="14" r="1.3" fill="var(--color-panel-solid)"/><circle cx="12" cy="14" r="1.3" fill="var(--color-panel-solid)"/><circle cx="16" cy="14" r="1.3" fill="var(--color-panel-solid)"/></svg>
      </span>
      <span class="m-tab-label">Schedule</span>
    </a>
    <a class="m-tab state-layer" role="button" tabindex="0" data-tab="bfms">
      <span class="m-tab-icon">
        <svg class="m-icon-outline" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>
        <svg class="m-icon-filled" viewBox="0 0 24 24" width="24" height="24"><circle cx="9" cy="7" r="4" fill="currentColor"/><path fill="currentColor" d="M9 13.5c-3.6 0-6.5 2.2-6.5 5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-1.5c0-2.8-2.9-5-6.5-5z"/><path fill="currentColor" d="M16.8 3.3a1 1 0 0 1 1.2-.7 4.5 4.5 0 0 1 0 8.8 1 1 0 1 1-.5-2 2.5 2.5 0 0 0 0-4.8 1 1 0 0 1-.7-1.3z"/><path fill="currentColor" d="M18.2 14.6a1 1 0 0 1 1.2-.8c2.1.5 3.6 2.2 3.6 4.2V20a1 1 0 0 1-1 1h-2.3a1 1 0 0 1 0-2h1.3v-1c0-1-.8-1.9-2-2.2a1 1 0 0 1-.8-1.2z"/></svg>
      </span>
      <span class="m-tab-label">BFMs</span>
    </a>
    <a class="m-tab state-layer" role="button" tabindex="0" data-tab="messages">
      <span class="m-tab-icon">
        <svg class="m-icon-outline" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg>
        <svg class="m-icon-filled" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M4 3h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7.2a2 2 0 0 0-1.4.6l-2.2 2.2A.7.7 0 0 1 2 21.3V5a2 2 0 0 1 2-2z"/><circle cx="8" cy="11" r="1.25" fill="var(--color-panel-solid)"/><circle cx="12" cy="11" r="1.25" fill="var(--color-panel-solid)"/><circle cx="16" cy="11" r="1.25" fill="var(--color-panel-solid)"/></svg>
      </span>
      <span class="m-tab-label">Messages</span>
      <span class="m-tab-badge" id="tabMsgBadge" hidden>0</span>
    </a>
    <a class="m-tab state-layer" role="button" tabindex="0" data-tab="more">
      <span class="m-tab-icon">
        <svg class="m-icon-outline" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <svg class="m-icon-filled" viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="7.5" height="7.5" rx="2" fill="currentColor"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" fill="currentColor"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" fill="currentColor"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" fill="currentColor"/></svg>
      </span>
      <span class="m-tab-label">More</span>
    </a>
  </nav>
</div>

<!-- Overlay hosts live outside .m-app so sheets, dialogs and full-screen
     surfaces are not clipped by the shell's overflow:hidden. -->
<div id="overlayHost"></div>
<div class="m-snackbar-host" id="snackHost"></div>

<!-- Order matters: data, then the core (which creates APP and renders Home),
     then each screen module, which registers itself against APP. -->
<script src="./mobile-data.js?v=15"></script>
<script src="./mobile-app.js?v=15"></script>
<script src="./mobile-schedule.js?v=15"></script>
<script src="./mobile-people.js?v=15"></script>
<script src="./mobile-comms.js?v=15"></script>
</body>
</html>
